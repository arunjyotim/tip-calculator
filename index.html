<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tip Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Tip Calculator</h1>
    </header>
    <div class="calculator">
      <section class="inputs-section">
        <div class="field">
          <label for="bill">Bill Amount</label>
          <div class="input-wrap">
            <span class="prefix">$</span>
            <input type="number" id="bill" value="50.00" min="0" step="0.01">
          </div>
        </div>
        <div class="field">
          <label>Select Tip</label>
          <div class="tip-grid" id="tip-grid">
            <button type="button" class="tip-btn" data-tip="10">10%</button>
            <button type="button" class="tip-btn active" data-tip="15">15%</button>
            <button type="button" class="tip-btn" data-tip="18">18%</button>
            <button type="button" class="tip-btn" data-tip="20">20%</button>
            <button type="button" class="tip-btn" data-tip="25">25%</button>
            <input type="number" id="custom-tip" class="custom-tip-input" placeholder="Custom" min="0" max="100">
          </div>
        </div>
        <div class="field">
          <label for="split">Number of People</label>
          <div class="split-control">
            <button type="button" id="split-minus" class="split-btn">-</button>
            <input type="number" id="split" value="1" min="1" step="1">
            <button type="button" id="split-plus" class="split-btn">+</button>
          </div>
        </div>
      </section>
      <section class="results-section">
        <div class="result-row">
          <span class="label">Tip Amount</span>
          <span class="value" id="tip-amount">$7.50</span>
        </div>
        <div class="result-row">
          <span class="label">Total Bill</span>
          <span class="value" id="total-amount">$57.50</span>
        </div>
        <div class="result-row">
          <span class="label">Per Person</span>
          <span class="value highlight" id="per-person">$57.50</span>
        </div>
        <button type="button" id="reset-btn" class="reset-btn">Reset</button>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
